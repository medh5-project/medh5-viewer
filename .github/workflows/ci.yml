name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS, Apple silicon)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sw_vers
          xcodebuild -version
          swift --version
          rustc --version
          cmake --version | head -1

      - name: Cache the bridge build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cargo
          key: bridge-${{ runner.os }}-${{ hashFiles('bridge/Cargo.lock', 'bridge/Cargo.toml') }}
          restore-keys: bridge-${{ runner.os }}-

      - name: Build the bridge
        run: scripts/build-bridge.sh

      - name: Third-party notices are current
        run: python3 -I scripts/third_party_notices.py --check

      - name: Build the app bundle
        run: scripts/build-app.sh

      - name: Package
        run: scripts/package-dmg.sh

      # Before the tests: when one fails, the app and its snapshots show why.
      - uses: actions/upload-artifact@v4
        with:
          name: medh5-viewer-${{ github.sha }}
          path: build/dist/*
          retention-days: 14

      - name: Test everything
        run: scripts/test.sh

  snapshots:
    name: Snapshots (${{ matrix.runner }})
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medh5-viewer-${{ github.sha }}
          path: dist

      - name: Take the snapshots
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | grep -E 'Resolution|Main Display'
          ditto -x -k dist/*.zip .
          viewer="medh5 Viewer.app/Contents/MacOS/medh5-viewer"
          for layout in single 1x3 2x2 3d compare; do
            "$viewer" --snapshot --demo --demo-size 64 --no-verify --out "snapshots/$layout" \
              --layout "$layout" --size 1440x880
            "$viewer" --snapshot --demo --demo-size 64 --no-verify --out "snapshots/$layout-narrow" \
              --layout "$layout" --size 900x560 --widest-panels
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.runner }}-${{ github.sha }}
          path: snapshots
          retention-days: 14
